<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <!-- Method 1: Meta Refresh (Redirects after 0 seconds) -->
    <meta http-equiv="refresh" content="0; url=https://aether.isroot.in">
    
    <!-- Method 2: JavaScript Redirect -->
    <script type="text/javascript">
        window.location.href = "https://aether.isroot.in";
    </script>
</head>
<body>
    <!-- Method 3: Fallback Link -->
    <p>If you are not redirected automatically, follow this <a href="https://aether.isroot.in">link to aether.isroot.in</a>.</p>
</body>
</html>
